[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "webtrawl"
version = "0.1.0"
description = "Agent-native web search and page extraction CLI: multi-provider discovery, a four-tier extraction cascade, and TOON output for AI agents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Yanis Labeyrie" }]
keywords = [
    "ai-agents",
    "web-scraping",
    "web-search",
    "cli",
    "llm",
    "rag",
    "markdown",
    "trafilatura",
    "brave-search",
    "tavily",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12",
    "python-toon>=0.1.3",
    "requests>=2.31",
    "curl-cffi>=0.16.2",
    "trafilatura>=2.2.0",
    "scrapling[fetchers]>=0.4.15",
    "markitdown[pdf]>=0.1.1",
    "beautifulsoup4>=4.12",
    "pillow>=10",
]

[project.scripts]
webtrawl = "run_webtrawl:main"

[project.urls]
Homepage = "https://github.com/aiandcivilization/webtrawl"
Repository = "https://github.com/aiandcivilization/webtrawl"
Issues = "https://github.com/aiandcivilization/webtrawl/issues"
Changelog = "https://github.com/aiandcivilization/webtrawl/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["run_webtrawl"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
"_vendor.cli_common" = ["*.toml", "VENDOR.md"]

[tool.ruff]
line-length = 110
target-version = "py312"
# `extend-exclude`, not `exclude`: assigning `exclude` replaces ruff's defaults
# and makes it lint `.venv`, which is how the first CI run produced 3 323 errors.
extend-exclude = ["src/_vendor"]

[tool.ruff.lint]
select = ["E9", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
